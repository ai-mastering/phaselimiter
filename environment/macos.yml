name: phaselimiter-build
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - cmake=3.27.9
  - ninja=1.12
  - boost-cpp=1.78.0
  - armadillo=12.6.2
  - tbb-devel>=2021.8
  - llvm-openmp=18.1.3
  - libsndfile=1.2.2
  - libpng=1.6.43
  - libjpeg-turbo=3.0.0
  - zlib=1.3.1
  - pip
  - pip:
      - imageio-ffmpeg==0.6.0
# Use Xcode/Command Line Tools for AppleClang and the macOS SDK.
# DSP functions come from the system Accelerate framework; IPP is not needed.
