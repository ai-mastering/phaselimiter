name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@v4.1.0
        with:
          activate-environment: phaselimiter-build
          environment-file: environment/windows.yml
          miniforge-version: latest
          auto-activate: false
          # Only Bash is used below; avoid `conda init --all` and profile edits.
          run-init: false
          remove-profiles: false
      - name: Cache legacy SDK downloads
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: windows-sdk-downloads-${{ hashFiles('environment/dependencies.json') }}
      - name: Fetch pinned legacy SDKs
        run: |
          source "$(cygpath -u "$CONDA")/etc/profile.d/conda.sh"
          conda activate phaselimiter-build
          python script/fetch_build_dependencies.py --platform windows \
            --prefix build/dependencies --cache-dir build/downloads
      - name: Configure and build
        run: |
          source "$(cygpath -u "$CONDA")/etc/profile.d/conda.sh"
          conda activate phaselimiter-build
          sdk_prefix="$(cygpath -m "$PWD/build/dependencies/windows")"
          cmake -S . -B build/windows -A x64 -DBUILD_TESTING=ON -DSANDYBRIDGE_SUPPORT=ON \
            "-DCMAKE_PREFIX_PATH=$sdk_prefix;$sdk_prefix/Library" \
            "-DIPPROOT=$sdk_prefix" \
            "-DTBB_ROOT=$sdk_prefix/Library" \
            "-DPHASELIMITER_RUNTIME_DIRS=$sdk_prefix/Library/bin"
          cmake --build build/windows --config Release --parallel 2
      - name: CTest, CLI smoke and integration
        run: |
          source "$(cygpath -u "$CONDA")/etc/profile.d/conda.sh"
          conda activate phaselimiter-build
          mkdir -p build/tools/ffmpeg
          python -c 'import imageio_ffmpeg, shutil; shutil.copy2(imageio_ffmpeg.get_ffmpeg_exe(), "build/tools/ffmpeg/ffmpeg.exe")'
          export PATH="$PWD/build/tools/ffmpeg:$PWD/build/dependencies/windows/Library/bin:$PWD/prebuilt/win64/libsndfile-1.2.2-win64/bin:$PATH"
          # Exercise the encoder required by phase_limiter before the costly checks.
          ffmpeg -v error -i test_data/test2.wav -t 0.1 -acodec libmp3lame -ab 320k -f mp3 -y build/tools/ffmpeg/smoke.mp3
          ctest --test-dir build/windows -C Release --output-on-failure --no-tests=error --output-junit results.xml
          cmake "-DTOOL=$PWD/build/windows/bin/Release/snd_file_info.exe" \
            "-DINPUT=$PWD/test_data/test2.wav" -P cmake/TestSndFileInfo.cmake
          python script/prepare_dataset.py --destination build/dataset
          mkdir -p build/data
          build/windows/bin/Release/audio_analyzer.exe --mode=sound_quality2_preparation \
            --analysis_data_dir="$PWD/build/dataset/analysis_shortpath" \
            --sound_quality2_cache="$PWD/build/data/sound_quality2_cache"
          python script/ci_checks.py --mode integration --bin-dir build/windows/bin/Release \
            --output-dir build/results/windows --sound-quality-cache build/data/sound_quality2_cache
      - name: Stage and archive (including resolved DLL dependencies)
        run: |
          source "$(cygpath -u "$CONDA")/etc/profile.d/conda.sh"
          conda activate phaselimiter-build
          python script/stage_release.py --build-dir build/windows --destination build/stage/windows \
            --sound-quality-cache build/data/sound_quality2_cache
          python script/package_release.py --stage-dir build/stage/windows --output build/artifacts/release.zip
          # Run the staged program with the SDK search path removed. DLLs must
          # be found next to the installed executable or in Windows itself.
          env -u CONDA_PREFIX -u CONDA_ROOT PATH="/c/Windows/System32:/c/Windows" \
            build/stage/windows/phaselimiter/bin/snd_file_info.exe --input=test_data/test2.wav
          env -u CONDA_PREFIX -u CONDA_ROOT PATH="/c/Windows/System32:/c/Windows" \
            build/stage/windows/phaselimiter/bin/phase_limiter.exe --version
          test -z "$(git status --porcelain)"
          git submodule foreach --quiet --recursive 'test -z "$(git status --porcelain)"'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/artifacts/release.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: |
            build/results
            build/windows/Testing
            build/windows/results.xml
