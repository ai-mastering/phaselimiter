name: Linux build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/build-environment
      - uses: actions/cache@v4
        with:
          path: build/ccache
          key: linux-ccache-${{ matrix.configuration }}-${{ hashFiles('environment/dependencies.json', 'Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            linux-ccache-${{ matrix.configuration }}-${{ hashFiles('environment/dependencies.json', 'Dockerfile') }}-
      - name: Build, test, and stage
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/workspace" --workdir /workspace \
            -e HOME=/tmp -e CCACHE_DIR=/workspace/build/ccache \
            phaselimiter-build:ci bash script/ci_linux.sh '${{ matrix.configuration }}'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.configuration }}-binaries
          path: build/${{ matrix.configuration }}/bin
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: sound-quality-cache
          path: build/data/sound_quality2_cache
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: linux-dsp-reference
          path: build/results/dsp-reference
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: linux-release
          path: build/artifacts/release.tar.xz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.configuration }}-test-results
          path: |
            build/${{ matrix.configuration }}/Testing
            build/results

  sanitizers:
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/build-environment
      - uses: actions/cache@v4
        with:
          path: build/ccache-sanitizers
          key: linux-ccache-sanitizers-${{ hashFiles('environment/dependencies.json', 'Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            linux-ccache-sanitizers-${{ hashFiles('environment/dependencies.json', 'Dockerfile') }}-
      - name: Build and test with ASan and UBSan
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/workspace" --workdir /workspace \
            -e HOME=/tmp -e CCACHE_DIR=/workspace/build/ccache-sanitizers \
            -e ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            -e UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            phaselimiter-build:ci bash -euo pipefail -c '
              ccache --zero-stats
              cmake -S . -B build/sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DSANDYBRIDGE_SUPPORT=ON -DBUILD_TESTING=ON -DPHASELIMITER_SANITIZERS=ON \
                -DCMAKE_EXE_LINKER_FLAGS=-no-pie
              cmake --build build/sanitizers --parallel 2
              ccache --show-stats
              ctest --test-dir build/sanitizers --output-on-failure --output-junit results.xml
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-sanitizer-results
          path: |
            build/sanitizers/Testing
            build/sanitizers/results.xml

  extended-checks:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mode: [benchmark, regression, valgrind]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-environment
      - uses: actions/download-artifact@v4
        with:
          name: linux-Release-binaries
          path: build/Release/bin
      - uses: actions/download-artifact@v4
        with:
          name: linux-Debug-binaries
          path: build/Debug/bin
      - uses: actions/download-artifact@v4
        with:
          name: sound-quality-cache
          path: build/data
      - name: Run extended checks
        env:
          CHECK_MODE: ${{ matrix.mode }}
        run: |
          chmod +x build/Release/bin/* build/Debug/bin/*
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/workspace" --workdir /workspace \
            -e HOME=/tmp -e CHECK_MODE \
            phaselimiter-build:ci bash -euo pipefail -c '
              config=Release
              if [ "$CHECK_MODE" = valgrind ]; then config=Debug; fi
              python3 script/ci_checks.py --mode "$CHECK_MODE" --bin-dir "build/$config/bin" \
                --output-dir "build/results/$CHECK_MODE" --sound-quality-cache build/data/sound_quality2_cache
              test -z "$(git status --porcelain)"
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.mode }}-results
          path: build/results

  macos:
    name: macos-${{ matrix.arch }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            backend: Accelerate
          - runner: macos-15-intel
            arch: x86_64
            backend: IPP
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - uses: conda-incubator/setup-miniconda@v4.1.0
        with:
          activate-environment: phaselimiter-build
          environment-file: environment/macos.yml
          miniforge-version: latest
          auto-activate: false
          run-init: false
          remove-profiles: false
      - name: Cache Intel Mac IPP downloads
        if: matrix.arch == 'x86_64'
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: macos-intel-ipp-${{ hashFiles('environment/dependencies.json') }}
      - name: Fetch pinned Intel Mac IPP
        if: matrix.arch == 'x86_64'
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate phaselimiter-build
          python script/fetch_build_dependencies.py --platform macos-intel \
            --prefix build/dependencies --cache-dir build/downloads
      - name: Build with ${{ matrix.backend }}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate phaselimiter-build
          dsp_options=()
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            dsp_options=("-DIPPROOT=$PWD/build/dependencies/macos-intel")
          fi
          cmake -S . -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DBUILD_TESTING=ON -DPHASELIMITER_STATIC_BOOST=OFF \
            "-DCMAKE_PREFIX_PATH=$CONDA_PREFIX" \
            "-DOpenMP_CXX_FLAGS=-Xpreprocessor -fopenmp" \
            "-DOpenMP_CXX_INCLUDE_DIR=$CONDA_PREFIX/include" \
            -DOpenMP_CXX_LIB_NAMES=omp \
            "-DOpenMP_omp_LIBRARY=$CONDA_PREFIX/lib/libomp.dylib" "${dsp_options[@]}"
          cmake --build build/macos --parallel 2
      - uses: actions/download-artifact@v4
        with:
          name: sound-quality-cache
          path: build/data
      - uses: actions/download-artifact@v4
        with:
          name: linux-dsp-reference
          path: build/data/dsp-reference
      - name: Test and load the Linux model cache
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate phaselimiter-build
          mkdir -p build/tools/ffmpeg
          python -c 'import imageio_ffmpeg, shutil; shutil.copy2(imageio_ffmpeg.get_ffmpeg_exe(), "build/tools/ffmpeg/ffmpeg")'
          chmod +x build/tools/ffmpeg/ffmpeg
          export PATH="$PWD/build/tools/ffmpeg:$PATH"
          ffmpeg -v error -i test_data/test2.wav -t 0.1 -acodec libmp3lame -ab 320k -f mp3 -y build/tools/ffmpeg/smoke.mp3
          ctest --test-dir build/macos --output-on-failure --no-tests=error --output-junit results.xml
          python script/ci_checks.py --mode integration --bin-dir build/macos/bin \
            --sound-quality-cache build/data/sound_quality2_cache \
            --output-dir build/results/macos-dsp
      - name: Compare native DSP results with Linux
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate phaselimiter-build
          export PATH="$PWD/build/tools/ffmpeg:$PATH"
          python script/check_dsp_port.py --bin-dir build/macos/bin \
            --sound-quality-cache build/data/sound_quality2_cache \
            --reference build/data/dsp-reference \
            --output-dir build/results/macos-dsp-comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.arch }}-results
          path: |
            build/macos/Testing
            build/macos/results.xml
            build/results/macos-dsp
            build/results/macos-dsp-comparison
