AllCops:
  Exclude:
    - 'bin/**/*'
    - 'deps/**/*'
    - 'build/**/*'
  TargetRubyVersion: 2.7
  NewCops: disable
Style/AsciiComments:
  Enabled: false
Layout/ArrayAlignment:
  EnforcedStyle: with_fixed_indentation
Metrics/BlockLength:
  Enabled: false
Layout/LineLength:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Metrics/ParameterLists:
  CountKeywordArgs: false
Style/Documentation:
  Enabled: false
Style/ClassAndModuleChildren:
  Enabled: false
Lint/UnusedBlockArgument:
  Enabled: false
Metrics/CyclomaticComplexity:
  Max: 8
Metrics/ClassLength:
  Max: 300
